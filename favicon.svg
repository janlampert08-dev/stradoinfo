<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Strado">
  <!-- Bis September 2026 stand hier das "s" der Wortmarke. Jetzt ist es das
       Signet (signet.svg), wie in der App.

       Das Zeichen ist nach der *Breite* bemessen, nicht nach der Hoehe: 70 %
       der Kachelkante, die Hoehe folgt ueber 92:54 — dieselben 70 %, die
       app/icon.tsx und app/apple-icon.tsx im App-Repo setzen. Bei einem
       Zeichen, das fast doppelt so breit wie hoch ist, ist die Breite das
       Mass; die Hoehe als Mass zu nehmen liesse es auf der Kachel schrumpfen.
       33.6 von 48 breit, 19.72 hoch, zentriert: translate(7.2 14.139).

       Die Akzentflaeche traegt in beiden Farbschemata, deshalb bleibt diese
       Datei einfarbig (siehe README, "Hell und Dunkel"). -->
  <rect width="48" height="48" fill="#3d5afe"/>
  <path fill="#fafafa" transform="translate(7.2 14.139) scale(0.365217)" d="M0 27A46 27 0 1 1 92 27A46 27 0 1 1 0 27ZM12 23.5A34 14.5 0 1 0 80 23.5A34 14.5 0 1 0 12 23.5Z"/>
